<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clover 论文汇报 HTML 幻灯片</title>
  <style>
    :root {
      --stage-bg: #101816;
      --slide-bg: #f8fbf7;
      --ink: #102426;
      --muted: #5a6f72;
      --line: rgba(16, 36, 38, .14);
      --paper: #ffffff;
      --teal: #0b8f88;
      --teal-soft: #dff5f1;
      --blue: #315fbd;
      --blue-soft: #e8efff;
      --risk: #d9552f;
      --risk-soft: #fff0e8;
      --gold: #b9860d;
      --gold-soft: #fff5d5;
      --noise: #7658c7;
      --noise-soft: #eee8ff;
      --shadow: 0 32px 90px rgba(10, 24, 26, .16);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --display: "Avenir Next", "Gill Sans", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --body: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", "Cascadia Code", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===========================================
       FIXED 16:9 STAGE: MANDATORY BASE STYLES
       Include this ENTIRE file in every presentation.
       Slides are authored at 1920x1080 and scaled as a whole.
       =========================================== */

    /* 1. Lock the browser viewport */
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 2. Full-window deck viewport */
    .deck-viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--stage-bg, #000);
    }

    /* 3. Fixed 16:9 design canvas.
       JavaScript sets transform: translate(...) scale(...). */
    .deck-stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
        background: var(--slide-bg, #fff);
    }

    /* 4. Slides stack inside the fixed stage.
       Content must be laid out at 1920x1080, not reflowed per device. */
    .slide {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        display: block;
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        background: var(--slide-bg, #fff);
    }

    .slide.active,
    .slide.visible {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        z-index: 1;
    }

    /* 5. Keep media inside authored slide bounds */
    img,
    video,
    canvas,
    svg {
        max-width: 100%;
        max-height: 100%;
    }

    /* 6. Presentation chrome stays outside the slide design system */
    .deck-controls {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        z-index: 1000;
    }

    /* 7. Print one fixed-size slide per page */
    @media print {
        @page {
            size: 16in 9in;
            margin: 0;
        }

        html,
        body {
            width: 1920px;
            height: auto;
            overflow: visible;
            background: #fff;
        }

        .deck-viewport {
            position: static;
            overflow: visible;
            background: #fff;
        }

        .deck-stage {
            position: static;
            width: auto;
            height: auto;
            transform: none !important;
            background: none;
        }

        .slide {
            position: relative;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            width: 1920px;
            height: 1080px;
            break-after: page;
            page-break-after: always;
        }

        .slide:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .slide .reveal {
            opacity: 1 !important;
            transform: none !important;
        }

        .deck-controls {
            display: none !important;
        }
    }

    /* 8. Reduced motion */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.2s !important;
        }
    }

    /* === Base Theme === */
    body {
      font-family: var(--body);
      color: var(--ink);
    }

    .deck-stage {
      border-radius: 26px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .32);
      isolation: isolate;
    }

    .deck-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 12%, rgba(11, 143, 136, .18), transparent 24%),
        radial-gradient(circle at 90% 16%, rgba(217, 85, 47, .12), transparent 24%),
        radial-gradient(circle at 78% 88%, rgba(49, 95, 189, .13), transparent 28%),
        linear-gradient(135deg, #ffffff 0%, #f7fbfa 45%, #edf7f4 100%);
    }

    .deck-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(11, 143, 136, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(11, 143, 136, .05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .8), rgba(0, 0, 0, .14));
    }

    .slide {
      padding: 74px 86px;
      z-index: 1;
      transition: opacity .34s var(--ease), transform .34s var(--ease);
      transform: translateX(36px);
    }

    .slide.visible {
      transform: translateX(0);
    }

    .slide > * {
      position: relative;
      z-index: 2;
    }

    .slide-grid {
      height: 100%;
      display: grid;
      grid-template-columns: 740px 1fr;
      gap: 54px;
      align-items: center;
    }

    .slide-grid.wide-copy {
      grid-template-columns: 820px 1fr;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .visual {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--teal);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: 0 14px 34px rgba(16, 36, 38, .08);
    }

    h1, h2, h3 {
      font-family: var(--display);
      color: var(--ink);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 900;
    }

    h1 {
      margin-top: 34px;
      font-size: 124px;
      max-width: 760px;
    }

    h2 {
      margin-top: 30px;
      font-size: 82px;
      max-width: 780px;
    }

    h3 {
      font-size: 34px;
    }

    .lead {
      margin-top: 30px;
      color: #31565a;
      font-size: 34px;
      line-height: 1.42;
      font-weight: 650;
      max-width: 770px;
    }

    .talk-points {
      margin-top: 36px;
      display: grid;
      gap: 18px;
      list-style: none;
      max-width: 760px;
    }

    .talk-points li {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 16px;
      align-items: start;
      color: #365d61;
      font-size: 27px;
      line-height: 1.38;
      font-weight: 720;
    }

    .talk-points li::before {
      content: "";
      width: 14px;
      height: 14px;
      margin-top: 12px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 10px rgba(11, 143, 136, .12);
    }

    .risk-text { color: var(--risk); }
    .blue-text { color: var(--blue); }
    .noise-text { color: var(--noise); }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 40px;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 16px;
      padding: 18px 26px;
      background: var(--teal);
      color: #fff;
      font-family: var(--body);
      font-size: 23px;
      font-weight: 900;
      box-shadow: 0 18px 38px rgba(11, 143, 136, .22);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #08736f;
    }

    button.secondary {
      color: var(--teal);
      background: rgba(255, 255, 255, .86);
      border: 1px solid rgba(11, 143, 136, .28);
      box-shadow: none;
    }

    button.risk { background: var(--risk); box-shadow: 0 18px 38px rgba(217, 85, 47, .22); }
    button.blue { background: var(--blue); box-shadow: 0 18px 38px rgba(49, 95, 189, .22); }
    button.noise { background: var(--noise); box-shadow: 0 18px 38px rgba(118, 88, 199, .22); }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .76);
      color: #335b5f;
      font-size: 22px;
      font-weight: 850;
      box-shadow: 0 12px 24px rgba(16, 36, 38, .06);
    }

    .note {
      margin-top: 34px;
      padding: 22px 26px;
      border-radius: 20px;
      background: rgba(223, 245, 241, .82);
      color: #255d61;
      font-size: 25px;
      line-height: 1.4;
      font-weight: 800;
      border: 1px solid rgba(11, 143, 136, .16);
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .6s var(--ease), transform .6s var(--ease);
    }

    .visible .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal:nth-child(2) { transition-delay: .06s; }
    .reveal:nth-child(3) { transition-delay: .12s; }
    .reveal:nth-child(4) { transition-delay: .18s; }
    .reveal:nth-child(5) { transition-delay: .24s; }

    /* === Diagram Components === */
    .diagram {
      width: 100%;
      min-height: 600px;
      border: 1px solid rgba(16, 36, 38, .12);
      border-radius: 34px;
      background: rgba(255, 255, 255, .72);
      box-shadow: var(--shadow);
      padding: 34px;
      position: relative;
      overflow: hidden;
    }

    .interactive-module {
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .interactive-module:hover {
      transform: translateY(-3px);
      border-color: rgba(11, 143, 136, .28);
      box-shadow: 0 26px 70px rgba(11, 143, 136, .13);
    }

    .diagram::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(223, 245, 241, .7), rgba(255, 255, 255, .2));
      pointer-events: none;
    }

    .diagram > * {
      position: relative;
      z-index: 1;
    }

    .mini-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .node {
      position: absolute;
      width: 188px;
      min-height: 126px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #fff;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(16, 36, 38, .1);
      color: var(--ink);
      font-weight: 950;
      font-size: 25px;
      transition: transform .28s var(--ease), border-color .28s ease, background .28s ease;
    }

    .node small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 17px;
      font-weight: 780;
    }

    .node.server {
      width: 220px;
      min-height: 148px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-color: rgba(11, 143, 136, .32);
      background: linear-gradient(145deg, #fff, #e9fbf8);
    }

    .node.client-a { left: 44px; top: 74px; }
    .node.client-b { right: 52px; top: 92px; }
    .node.client-c { left: 92px; bottom: 70px; }
    .node.client-d { right: 96px; bottom: 70px; }
    .node.is-active { transform: translateY(-10px); border-color: var(--teal); background: var(--teal-soft); }
    .node.server.is-active { transform: translate(-50%, -50%) scale(1.04); }

    .packet, .share {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      opacity: 0;
      background: var(--teal);
      box-shadow: 0 0 0 9px rgba(11, 143, 136, .13);
      z-index: 3;
    }

    .packet.p1 { left: 158px; top: 184px; }
    .packet.p2 { right: 168px; top: 204px; }
    .packet.p3 { left: 206px; bottom: 168px; }
    .packet.p4 { right: 212px; bottom: 168px; }
    .packet.is-active.p1 { animation: denseA 1.1s var(--ease) forwards; }
    .packet.is-active.p2 { animation: denseB 1.1s .12s var(--ease) forwards; }
    .packet.is-active.p3 { animation: denseC 1.1s .24s var(--ease) forwards; }
    .packet.is-active.p4 { animation: denseD 1.1s .36s var(--ease) forwards; }

    @keyframes denseA { 0% { opacity: 1; transform: translate(0, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(322px, 188px); } }
    @keyframes denseB { 0% { opacity: 1; transform: translate(0, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-316px, 172px); } }
    @keyframes denseC { 0% { opacity: 1; transform: translate(0, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(286px, -198px); } }
    @keyframes denseD { 0% { opacity: 1; transform: translate(0, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-282px, -198px); } }

    .vector-panel {
      width: 100%;
      max-width: 820px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .9);
      padding: 30px;
      box-shadow: 0 20px 54px rgba(16, 36, 38, .11);
    }

    .gradient-vector {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 13px;
      margin-top: 24px;
    }

    .grad-cell {
      min-height: 86px;
      border: 1px solid var(--line);
      border-radius: 18px;
      display: grid;
      place-items: center;
      position: relative;
      background: #f7fbfa;
      color: #355b60;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 850;
      transition: transform .25s var(--ease), opacity .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
    }

    .grad-cell::after {
      content: "i=" attr(data-index);
      position: absolute;
      top: -12px;
      right: -6px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--mono);
      font-weight: 850;
    }

    .grad-cell.is-active,
    .grad-cell.keep.is-active {
      transform: translateY(-10px);
      border-color: var(--teal);
      background: var(--teal-soft);
      color: var(--teal);
      box-shadow: 0 16px 28px rgba(11, 143, 136, .15);
    }

    .grad-cell.is-dropped {
      opacity: .22;
      transform: scale(.94);
      filter: grayscale(.8);
    }

    .grad-cell.is-risk,
    .index-marker.is-risk {
      border-color: var(--risk);
      background: var(--risk-soft);
      color: var(--risk);
      animation: riskPulse 1s ease infinite alternate;
    }

    @keyframes riskPulse {
      from { box-shadow: 0 0 0 0 rgba(217, 85, 47, .2); }
      to { box-shadow: 0 0 0 15px rgba(217, 85, 47, 0); }
    }

    .sparse-pairs {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .28s ease, transform .28s var(--ease);
    }

    .sparse-pairs[data-active="true"] {
      opacity: 1;
      transform: translateY(0);
    }

    .pair-card {
      padding: 18px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(11, 143, 136, .2);
      color: #275b5e;
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 850;
      text-align: center;
    }

    .pair-card.is-active {
      border-color: var(--teal);
      background: var(--teal-soft);
      color: var(--teal);
      transform: translateY(-6px);
      box-shadow: 0 14px 26px rgba(11, 143, 136, .12);
    }

    .meter-grid {
      margin-top: 28px;
      display: grid;
      gap: 16px;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 142px 1fr 128px;
      gap: 16px;
      align-items: center;
      color: #3c6267;
      font-size: 21px;
      font-weight: 850;
    }

    .bar {
      height: 16px;
      border-radius: 999px;
      background: #e5efed;
      overflow: hidden;
    }

    .bar span {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), #57c8bd);
      transition: width .32s var(--ease);
    }

    .bar.risk span { background: linear-gradient(90deg, var(--risk), #ed9c68); }
    .bar.noise span { background: linear-gradient(90deg, var(--noise), #b3a0f0); }

    .risk-board, .sparse-board, .clover-board, .dp-board {
      width: 100%;
      max-width: 850px;
      display: grid;
      gap: 22px;
    }

    .observed-indexes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .index-marker {
      min-height: 108px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #fff;
      display: grid;
      place-items: center;
      color: #31565a;
      font-family: var(--mono);
      font-size: 25px;
      font-weight: 900;
      transition: .25s ease;
    }

    .attacker-panel {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 22px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255, 255, 255, .9);
      padding: 24px;
      box-shadow: 0 18px 42px rgba(16, 36, 38, .1);
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      background: var(--risk-soft);
      color: var(--risk);
      font-size: 48px;
      font-weight: 900;
    }

    .thought {
      color: #31565a;
      font-size: 26px;
      line-height: 1.38;
      font-weight: 760;
    }

    .leak-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .leak-method {
      min-height: 118px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .92);
      padding: 20px 22px;
      box-shadow: 0 14px 30px rgba(16, 36, 38, .08);
      transition: .25s ease;
    }

    .leak-method strong {
      display: block;
      color: var(--risk);
      font-size: 25px;
      font-weight: 950;
      margin-bottom: 10px;
    }

    .leak-method span {
      color: #3a6064;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 760;
    }

    .leak-method.is-risk {
      border-color: rgba(217, 85, 47, .55);
      background: var(--risk-soft);
      transform: translateY(-5px);
      box-shadow: 0 18px 36px rgba(217, 85, 47, .12);
    }

    .triple-server,
    .trust-flow {
      height: 520px;
      position: relative;
    }

    .trust-flow {
      overflow: hidden;
      border-radius: 34px;
    }

    .trust-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .trust-lines path {
      fill: none;
      stroke-linecap: round;
      stroke-width: 4;
    }

    .share-path {
      stroke: rgba(49, 95, 189, .32);
      stroke-dasharray: 10 12;
    }

    .result-path {
      stroke: rgba(11, 143, 136, .32);
    }

    .flow-particles circle {
      opacity: .88;
      filter: drop-shadow(0 0 8px rgba(49, 95, 189, .28));
    }

    .share-particles circle {
      fill: var(--blue);
    }

    .result-particles circle {
      fill: var(--teal);
      filter: drop-shadow(0 0 8px rgba(11, 143, 136, .3));
    }

    .private-update,
    .aggregate-result {
      position: absolute;
      left: var(--card-x, auto);
      top: var(--card-y, auto);
      z-index: 2;
      width: 300px;
      min-height: 220px;
      border: 1px solid rgba(11, 143, 136, .24);
      border-radius: 26px;
      background: rgba(255, 255, 255, .92);
      padding: 26px;
      color: #295b5e;
      box-shadow: 0 18px 42px rgba(16, 36, 38, .1);
      transition: .25s ease;
    }

    .trust-input {
      --card-x: 122px;
      --card-y: 150px;
      border-color: rgba(49, 95, 189, .24);
      background: rgba(232, 239, 255, .68);
    }

    .aggregate-result {
      --card-x: 1328px;
      --card-y: 150px;
      background: rgba(223, 245, 241, .72);
    }

    .trust-kicker {
      display: block;
      margin-bottom: 12px;
      color: #6a7475;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .private-update strong,

    .fed-diagram.is-active .flow-dot.dn { animation-name: flowCn; animation-delay: 1.5s; }

      0% { opacity: 0; transform: translate(186px, 464px); }
      12% { opacity: 1; transform: translate(186px, 372px); }
      38% { opacity: 1; transform: translate(394px, 270px); }
      70% { opacity: 0; transform: translate(530px, 130px); }
      100% { opacity: 0; transform: translate(530px, 130px); }

    @keyframes flowC2 {

      70% { opacity: 0; transform: translate(595px, 130px); }
      100% { opacity: 0; transform: translate(595px, 130px); }

    @keyframes flowC3 {

      12% { opacity: 1; transform: translate(734px, 372px); }
      38% { opacity: 1; transform: translate(690px, 274px); }
      70% { opacity: 0; transform: translate(650px, 130px); }
      100% { opacity: 0; transform: translate(650px, 130px); }
    }

    @keyframes flowCn {
      0% { opacity: 0; transform: translate(1010px, 464px); }
      12% { opacity: 1; transform: translate(1010px, 372px); }
      38% { opacity: 1; transform: translate(840px, 270px); }
      70% { opacity: 0; transform: translate(710px, 130px); }
      100% { opacity: 0; transform: translate(710px, 130px); }

<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage" aria-label="Clover HTML presentation">
      <section class="slide active" data-title="加载中">
        <div class="full-flow" style="place-items:center;text-align:center;">
          <div class="center-title">
            <p class="eyebrow reveal">Loading</p>
            <h2 class="reveal">正在加载页面内容</h2>
          </div>
        </div>
      </section>
    </main>
  </div>

  <nav class="deck-controls" aria-label="幻灯片导航">
    <button id="prevBtn" type="button" title="上一页">‹</button>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="counter" id="counter">1 / 1</div>
    <button id="nextBtn" type="button" title="下一页">›</button>
  </nav>

  <script>
    const SLIDE_FILES = [
      "slides/slide-01.html",
      "slides/slide-02.html",
      "slides/slide-03.html",
      "slides/slide-04.html",
      "slides/slide-05.html",
      "slides/slide-06.html",
      "slides/slide-07.html",
      "slides/slide-08.html",
      "slides/slide-09.html",
      "slides/slide-10.html",
      "slides/slide-11.html",
      "slides/slide-12.html",
      "slides/slide-13.html",
      "slides/slide-14.html",
      "slides/slide-15.html",
      "slides/slide-16.html",
      "slides/slide-17.html",
      "slides/slide-18.html",
    ];

    async function loadSlidePartials() {
      const stage = document.getElementById("deckStage");
      const slides = await Promise.all(SLIDE_FILES.map(async (file) => {
        const response = await fetch(`${file}?v=20260703-encrypted-training-1`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Cannot load ${file}`);
        return response.text();
      }));
      stage.innerHTML = slides.join("\n");
    }

    class SlidePresentation {
      constructor() {
        this.slides = Array.from(document.querySelectorAll(".slide"));
        this.currentSlide = 0;
        this.stage = document.getElementById("deckStage");
        this.progressBar = document.getElementById("progressBar");
        this.counter = document.getElementById("counter");
        this.setupStageScale();
        this.setupKeyboardNav();
        this.setupTouchNav();
        this.setupClickNav();
        this.setupButtons();
        const requestedSlide = Number(new URLSearchParams(window.location.search).get("slide"));
        this.showSlide(Number.isInteger(requestedSlide) && requestedSlide > 0 ? requestedSlide - 1 : 0);
      }

      setupStageScale() {
        const scale = () => {
          const chrome = 84;
          const factor = Math.min(window.innerWidth / 1920, (window.innerHeight - chrome) / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = Math.max(10, (window.innerHeight - chrome - 1080 * factor) / 2);
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
          updateFedDiagramLayout(this.slides?.[this.currentSlide]?.querySelector(".fed-diagram"));
        };
        scale();
        window.addEventListener("resize", scale);
      }

      setupButtons() {
        document.getElementById("nextBtn").addEventListener("click", () => this.next());
        document.getElementById("prevBtn").addEventListener("click", () => this.prev());
      }

      setupKeyboardNav() {
        document.addEventListener("keydown", (event) => {
          if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
            event.preventDefault();
            this.next();
          }
          if (event.key === "ArrowLeft" || event.key === "PageUp") {
            event.preventDefault();
            this.prev();
          }
          if (event.key === "Home") this.showSlide(0);
          if (event.key === "End") this.showSlide(this.slides.length - 1);
        });
      }

      setupTouchNav() {
        let startX = 0;
        this.stage.addEventListener("touchstart", (event) => {
          startX = event.changedTouches[0].clientX;
        }, { passive: true });
        this.stage.addEventListener("touchend", (event) => {
          const dx = event.changedTouches[0].clientX - startX;
          if (Math.abs(dx) > 60) {
            if (dx < 0) this.next();
            else this.prev();
          }
        }, { passive: true });
      }

      setupClickNav() {
        this.stage.addEventListener("click", (event) => {
          const module = event.target.closest(".interactive-module");
          if (module) {
            event.stopPropagation();
            runInteractiveModule(module.dataset.action);
            return;
          }
          if (event.target.closest("button, input, a, label, select, textarea")) return;
          this.next();
        });
      }

      showSlide(index) {
        this.currentSlide = (index + this.slides.length) % this.slides.length;
        this.slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === this.currentSlide);
          slide.classList.toggle("visible", i === this.currentSlide);
        });
        this.progressBar.style.width = `${((this.currentSlide + 1) / this.slides.length) * 100}%`;
        this.counter.textContent = `${this.currentSlide + 1} / ${this.slides.length}`;
        resetSlideAnimations(this.slides[this.currentSlide]);
        requestAnimationFrame(() => updateFedDiagramLayout(this.slides[this.currentSlide].querySelector(".fed-diagram")));
      }

      next() { this.showSlide(this.currentSlide + 1); }
      prev() { this.showSlide(this.currentSlide - 1); }
    }

    let deck;

    function activeSlide() {
      return deck.slides[deck.currentSlide];
    }

    function resetSlideAnimations(slide) {
      slide.querySelectorAll("[data-active]").forEach((el) => el.removeAttribute("data-active"));
      slide.querySelectorAll(".is-active, .is-risk, .is-hidden, .is-noisy, .is-dropped").forEach((el) => {
        el.classList.remove("is-active", "is-risk", "is-hidden", "is-noisy", "is-dropped");
      });
      if (slide.querySelector("#denseUploadBar")) {
        document.getElementById("denseUploadBar").style.width = "0%";
        document.getElementById("denseCost").textContent = "点击演示";
      }
      if (slide.querySelector("#topkVector")) {
        document.querySelectorAll("#topkVector .grad-cell").forEach((cell) => {
          cell.classList.remove("is-active", "is-dropped");
        });
        document.getElementById("topkUploadBar").style.width = "100%";
        document.getElementById("topkUploadText").textContent = "100%";
        document.getElementById("topkSaveBar").style.width = "0%";
        document.getElementById("topkSaveText").textContent = "0%";
      }
      if (slide.querySelector("#riskThought")) {
        document.getElementById("riskThought").textContent = "服务器观察到的是 top-k 位置和值。";
      }
      if (slide.querySelector("#epsilonSlider")) {
        document.getElementById("epsilonSlider").value = "5";
        updateDPTradeoff();
      }
    }

    function resetCurrentSlide() {
      resetSlideAnimations(deck.slides[deck.currentSlide]);
    }

    function runInteractiveModule(action) {
      if (action === "fl") playFLFlow();
      if (action === "dense") playDenseUpload();
      if (action === "topk") playTopK();
      if (action === "risk") playIndexRisk();
      if (action === "sparse") playSparseRepresentation();
      if (action === "hidden-aggregation") playHiddenAggregation();
    }

    function updateFedDiagramLayout(diagram) {
      if (!diagram) return;
      const svg = diagram.querySelector(".fed-lines");
      const staticLayer = svg?.querySelector("[data-fed-static]");
      const flowLayer = svg?.querySelector("[data-fed-flows]");
      const server = diagram.querySelector(".fed-server");
      const serverPorts = diagram.querySelector(".fed-server-ports");
      const clients = Array.from(diagram.querySelectorAll(".fed-client"));
      if (!svg || !staticLayer || !flowLayer || !server || !serverPorts || clients.length === 0) return;

      const diagramRect = diagram.getBoundingClientRect();
      const scaleX = diagram.offsetWidth / diagramRect.width;
      const scaleY = diagram.offsetHeight / diagramRect.height;
      const ns = "http://www.w3.org/2000/svg";

      const point = (el, xRatio, yRatio) => {
        const rect = el.getBoundingClientRect();
        return {
          x: (rect.left - diagramRect.left + rect.width * xRatio) * scaleX,
          y: (rect.top - diagramRect.top + rect.height * yRatio) * scaleY,
        };
      };

      const path = (className, d) => {
        const item = document.createElementNS(ns, "path");
        item.setAttribute("class", className);
        item.setAttribute("d", d);
        item.setAttribute("data-flow-path", "");
        return item;
      };

      const flow = (className, d, delay) => {
        const circle = document.createElementNS(ns, "circle");
        const motion = document.createElementNS(ns, "animateMotion");
        circle.setAttribute("class", `flow-circle ${className}`.trim());
        circle.setAttribute("r", "8");
        motion.setAttribute("dur", "7s");
        motion.setAttribute("begin", `${delay}s`);
        motion.setAttribute("repeatCount", "indefinite");
        motion.setAttribute("path", d);
        circle.appendChild(motion);
        return circle;
      };

      svg.setAttribute("viewBox", `0 0 ${diagram.offsetWidth} ${diagram.offsetHeight}`);
      staticLayer.replaceChildren();
      flowLayer.replaceChildren();
      serverPorts.replaceChildren(...clients.map(() => {
        const port = document.createElement("span");
        port.className = "fed-port";
        return port;
      }));

      const ports = Array.from(serverPorts.querySelectorAll(".fed-port"));
      const clientGeometry = clients.map((client, index) => {
        const model = client.querySelector(".model-cube");
        const port = ports[index];
        const center = point(model, .5, .5);
        const portCenter = point(port, .5, .5);
        const side = center.x < portCenter.x ? -1 : 1;
        return {
          index,
          side,
          port: { x: portCenter.x, y: portCenter.y + 5 },
          downEnd: point(model, .5, -.12),
          upStart: point(model, .5, .06),
        };
      });

      clientGeometry.forEach((client) => {
        const offset = client.side < 0 ? -9 : 9;
        const down = `M${client.port.x} ${client.port.y} L${client.downEnd.x + offset} ${client.downEnd.y}`;
        const up = `M${client.upStart.x - offset} ${client.upStart.y + 20} L${client.port.x} ${client.port.y}`;
        staticLayer.appendChild(path("down-line", down));
        staticLayer.appendChild(path("up-line", up));
        flowLayer.appendChild(flow("down", down, client.index * .35));
        flowLayer.appendChild(flow("", up, 2.2 + client.index * .35));
      });
    }

    function playFLFlow() {
      const slide = activeSlide();
      const diagram = slide.querySelector(".fed-diagram");
      updateFedDiagramLayout(diagram);
      diagram.classList.remove("is-active");
      void diagram.offsetWidth;
      diagram.classList.add("is-active");
      diagram.querySelectorAll("animateMotion").forEach((motion) => {
        if (typeof motion.beginElement === "function") motion.beginElement();
      });
    }

    function playDenseUpload() {
      const slide = activeSlide();
      slide.querySelectorAll(".upload-packet").forEach((packet, i) => {
        packet.style.animationDelay = `${i * 120}ms`;
        packet.classList.add("is-active");
      });
      slide.querySelector("#denseServer").classList.add("is-active");
      document.getElementById("denseUploadBar").style.width = "100%";
      document.getElementById("denseCost").textContent = "每轮 N x d";
    }

    function playTopK() {
      const slide = activeSlide();
      slide.querySelectorAll("#topkVector .grad-cell").forEach((cell) => {
        const keep = cell.classList.contains("keep");
        cell.classList.toggle("is-dropped", !keep);
        cell.classList.toggle("is-active", keep);
      });
      document.getElementById("topkPairs").setAttribute("data-active", "true");
      document.getElementById("topkUploadBar").style.width = "38%";
      document.getElementById("topkUploadText").textContent = "3/8 + index";
      document.getElementById("topkSaveBar").style.width = "62%";
      document.getElementById("topkSaveText").textContent = "约 62%";
    }

    function playIndexRisk() {
      const slide = activeSlide();
      slide.querySelectorAll(".index-marker").forEach((marker) => marker.classList.add("is-risk"));
      slide.querySelectorAll(".leak-method").forEach((method, i) => {
        setTimeout(() => method.classList.add("is-risk"), i * 90);
      });
      document.getElementById("indexRiskPanel").setAttribute("data-active", "true");
      document.getElementById("riskThought").textContent = "即使 value 被隐藏，index=2、4、6 的模式仍可能暗示本地数据分布。";
    }

    function playSparseRepresentation() {
      const slide = activeSlide();
      slide.querySelectorAll(".sparse-entry").forEach((entry, i) => {
        setTimeout(() => entry.classList.add("is-active"), i * 90);
      });
    }

    function playHiddenAggregation() {
      const slide = activeSlide();
      slide.querySelector("#privateUpdate").classList.add("is-hidden");
      slide.querySelectorAll(".share-line").forEach((line, i) => {
        line.style.animationDelay = `${i * 120}ms`;
        line.classList.add("is-active");
      });
      slide.querySelectorAll(".server-card").forEach((server) => server.classList.add("is-active"));
      document.getElementById("aggregateVector").setAttribute("data-active", "true");
    }

    function updateDPTradeoff() {
      const epsilon = Number(document.getElementById("epsilonSlider").value);
      const strongPrivacy = epsilon <= 3;
      const weakPrivacy = epsilon >= 8;
      const noiseWidth = Math.max(18, 100 - epsilon * 8);
      document.getElementById("privacyLabel").textContent = strongPrivacy ? "强" : weakPrivacy ? "弱" : "中";
      document.getElementById("noiseLabel").textContent = strongPrivacy ? "大" : weakPrivacy ? "小" : "中";
      document.getElementById("utilityLabel").textContent = strongPrivacy ? "较低" : weakPrivacy ? "较高" : "中";
      document.getElementById("noiseBar").style.width = `${noiseWidth}%`;
      document.getElementById("epsilonText").textContent = `epsilon=${epsilon}`;
    }

    async function initDeck() {
      try {
        await loadSlidePartials();
        const epsilonSlider = document.getElementById("epsilonSlider");
        if (epsilonSlider) epsilonSlider.addEventListener("input", updateDPTradeoff);
        deck = new SlidePresentation();
        if (epsilonSlider) updateDPTradeoff();
      } catch (error) {
        const stage = document.getElementById("deckStage");
        stage.innerHTML = `<section class="slide active"><div class="full-flow" style="place-items:center;text-align:center;"><div class="center-title"><p class="eyebrow reveal">Load Error</p><h2 class="reveal">页面分文件加载失败</h2><p class="lead reveal">${error.message}</p></div></div></section>`;
        console.error(error);
      }
    }

    initDeck();
  </script>
</body>
</html>
